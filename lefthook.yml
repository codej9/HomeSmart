commit-msg:
  jobs:
    - name: type
      run: |
        head -1 {1} | grep -Eq '^(Merge|Revert) |^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+' \
          || { echo "Start the commit message with a type, for example 'feat: add door alerts'." >&2; exit 1; }

pre-commit:
  jobs:
    - name: whitespace
      run: git diff --cached --check

pre-push:
  jobs:
    - name: verify
      run: ./mvnw -B verify
