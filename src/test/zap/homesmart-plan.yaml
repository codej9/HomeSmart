# Run through src/test/zap/run-zap.sh with HS_EVIDENCE_PASSWORD and HS_ZAP_REPORT_DIR exported.
# The script fills the ${HS_ZAP_SESSION} placeholder in a copy of this plan.
env:
  contexts:
    - name: homesmart
      urls:
        - http://127.0.0.1:8083/homesmart/
      includePaths:
        - http://127.0.0.1:8083/homesmart/.*
      excludePaths:
        - http://127.0.0.1:8083/homesmart/logout.*
      authentication:
        method: form
        parameters:
          loginPageUrl: http://127.0.0.1:8083/homesmart/login
          loginRequestUrl: http://127.0.0.1:8083/homesmart/login
          # shortcut: the form login fails on the session-bound CSRF token; the replacer job carries the session.
          loginRequestBody: username={%username%}&password={%password%}
        verification:
          method: response
          loggedInRegex: '\QLog out\E'
          loggedOutRegex: '\Qname="password"\E'
      sessionManagement:
        method: cookie
      users:
        - name: evidence
          credentials:
            username: evidence
            password: ${HS_EVIDENCE_PASSWORD}
  parameters:
    failOnError: true
    progressToStdout: true
jobs:
  - type: passiveScan-config
  # Sends the signed-in session cookie on every request.
  - type: replacer
    rules:
      - description: signed-in session cookie
        matchType: req_header
        matchString: Cookie
        replacementString: JSESSIONID=${HS_ZAP_SESSION}
  - type: spider
    parameters:
      context: homesmart
      user: evidence
      maxDuration: 5
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  # The active scan fuzzes /login and can trip the login throttle; the refusals are expected.
  - type: activeScan
    parameters:
      context: homesmart
      user: evidence
      policy: Default Policy
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 30
  - type: report
    parameters:
      template: traditional-html-plus
      reportDir: ${HS_ZAP_REPORT_DIR}
      reportFile: homesmart-zap
      reportTitle: HomeSmart evidence scan
  - type: report
    parameters:
      template: traditional-json-plus
      reportDir: ${HS_ZAP_REPORT_DIR}
      reportFile: homesmart-zap
      reportTitle: HomeSmart evidence scan
